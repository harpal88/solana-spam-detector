<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Spam Detector - Minimal Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      padding: 20px;
    }
    .tab-content {
      padding: 20px;
      border: 1px solid #dee2e6;
      border-top: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">Solana Spam Detector Dashboard</h1>
    
    <!-- Simple Tab Navigation -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="token-tab" data-bs-toggle="tab" data-bs-target="#token" type="button" role="tab" aria-controls="token" aria-selected="true">Token Analysis</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="transaction-tab" data-bs-toggle="tab" data-bs-target="#transaction" type="button" role="tab" aria-controls="transaction" aria-selected="false">Transaction Analysis</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="wallet-tab" data-bs-toggle="tab" data-bs-target="#wallet" type="button" role="tab" aria-controls="wallet" aria-selected="false">Wallet Analysis</button>
      </li>
    </ul>
    
    <!-- Tab Content -->
    <div class="tab-content" id="myTabContent">
      <!-- Token Analysis Tab -->
      <div class="tab-pane fade show active" id="token" role="tabpanel" aria-labelledby="token-tab">
        <h2>Token Analysis</h2>
        <form id="tokenForm" class="mb-4">
          <div class="mb-3">
            <label for="tokenMint" class="form-label">Token Mint Address</label>
            <input type="text" class="form-control" id="tokenMint" required placeholder="Enter token mint address">
          </div>
          <button type="submit" class="btn btn-primary">Analyze Token</button>
        </form>
        
        <div class="card">
          <div class="card-header">
            <h5 class="card-title mb-0">Results</h5>
          </div>
          <div class="card-body">
            <p>Token analysis results will appear here.</p>
          </div>
        </div>
      </div>
      
      <!-- Transaction Analysis Tab -->
      <div class="tab-pane fade" id="transaction" role="tabpanel" aria-labelledby="transaction-tab">
        <h2>Transaction Analysis</h2>
        <form id="transactionForm" class="mb-4">
          <div class="mb-3">
            <label for="transactionSignature" class="form-label">Transaction Signature</label>
            <input type="text" class="form-control" id="transactionSignature" required placeholder="Enter transaction signature">
          </div>
          <button type="submit" class="btn btn-primary">Analyze Transaction</button>
        </form>
        
        <div class="card">
          <div class="card-header">
            <h5 class="card-title mb-0">Results</h5>
          </div>
          <div class="card-body">
            <p>Transaction analysis results will appear here.</p>
          </div>
        </div>
      </div>
      
      <!-- Wallet Analysis Tab -->
      <div class="tab-pane fade" id="wallet" role="tabpanel" aria-labelledby="wallet-tab">
        <h2>Wallet Analysis</h2>
        <form id="walletForm" class="mb-4">
          <div class="mb-3">
            <label for="walletAddress" class="form-label">Wallet Address</label>
            <input type="text" class="form-control" id="walletAddress" required placeholder="Enter wallet address">
          </div>
          <button type="submit" class="btn btn-primary">Analyze Wallet</button>
        </form>
        
        <div class="card">
          <div class="card-header">
            <h5 class="card-title mb-0">Results</h5>
          </div>
          <div class="card-body">
            <p>Wallet analysis results will appear here.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Simple Dashboard Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('Minimal dashboard initialized');
      
      // Form submission handlers
      document.getElementById('tokenForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Token analysis form submitted');
      });
      
      document.getElementById('transactionForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Transaction analysis form submitted');
      });
      
      document.getElementById('walletForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Wallet analysis form submitted');
      });
    });
  </script>
</body>
</html>
