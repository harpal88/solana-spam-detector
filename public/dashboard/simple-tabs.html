<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Tabs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .tab-content { padding: 20px; border: 1px solid #dee2e6; border-top: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simple Tabs</h1>
    
    <ul class="nav nav-tabs" id="myTabs">
      <li class="nav-item">
        <a class="nav-link active" href="#tab1">Tab 1</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#tab2">Tab 2</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#tab3">Tab 3</a>
      </li>
    </ul>
    
    <div class="tab-content">
      <div class="tab-pane active" id="tab1">
        <h2>Tab 1 Content</h2>
        <p>This is the content for Tab 1.</p>
      </div>
      <div class="tab-pane" id="tab2">
        <h2>Tab 2 Content</h2>
        <p>This is the content for Tab 2.</p>
      </div>
      <div class="tab-pane" id="tab3">
        <h2>Tab 3 Content</h2>
        <p>This is the content for Tab 3.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Get all tab links
      const tabLinks = document.querySelectorAll('#myTabs .nav-link');
      
      // Add click event to each tab link
      tabLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          
          // Remove active class from all tabs and tab panes
          tabLinks.forEach(tab => tab.classList.remove('active'));
          document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
          
          // Add active class to clicked tab
          this.classList.add('active');
          
          // Get the target tab pane and activate it
          const targetId = this.getAttribute('href');
          document.querySelector(targetId).classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
